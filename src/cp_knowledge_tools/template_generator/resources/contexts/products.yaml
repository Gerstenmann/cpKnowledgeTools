context_id: products
title: Product Templates
version: '1.0'
description: Vorlagen für langlebige Products und Operating Ventures einschließlich Product Management, Service Portfolio, Programs, Operations, Education, CRM, Kommunikation, Finance, Systems, Processes, Development und Sources.
output_root: Templates/Products
directories:
- path: Product Management
  purpose: Kanonischer Product-Management-Kontext für Vision, Nutzen, Geschäftsmodell, Stakeholder und Portfolio.
  example: Strategische Steuerung des Products JuniorCodingClub.
- path: Service Portfolio
  purpose: Wiederkehrende Leistungen des Products als Service Offerings.
  example: Coding Clubs, Holiday Camps und Teacher Training.
- path: Programs
  purpose: Längerfristige Programme innerhalb oder im Umfeld des Products.
  example: Robogirls als mehrjähriges Förderprogramm.
- path: Operations
  purpose: Übergreifender Run-Kontext konkreter Product-Durchführungen.
  example: Aktive Kurse, Camps und Partneraktivitäten.
- path: Operations/Courses
  purpose: Konkrete Kursdurchführungen.
  example: Ein zehnwöchiger Python-Grundkurs.
- path: Operations/Coding Clubs
  purpose: Konkrete wiederkehrende Coding-Club-Aktivitäten.
  example: Wöchentlicher Coding Club an der FIS.
- path: Operations/Camps
  purpose: Konkrete Feriencamp- oder Intensivformat-Aktivitäten.
  example: FIS REAL Minecraft Camp im Juli 2026.
- path: Operations/Schools and Partners
  purpose: Operative Kontexte mit Schulen und Delivery-Partnern.
  example: Laufende Kooperation mit einer internationalen Schule.
- path: Operations/Operations Notes
  purpose: Nichtkanonische operative Arbeitsnotizen.
  example: Vorläufige Planung eines zusätzlichen Club-Termins.
- path: Education
  purpose: Product-spezifischer pädagogischer Kontext.
  example: JuniorCodingClub-spezifische Bildungslogik.
- path: Education/Curriculum
  purpose: Product-spezifische Curricula und Kompetenzmodelle.
  example: Coding Curriculum für Altersgruppe 9 bis 12.
- path: Education/Course Concepts
  purpose: Konzeption einzelner Kursformate.
  example: Minecraft Education Coding Fundamentals.
- path: Education/Learning Paths
  purpose: Progressive Lernpfade über mehrere Formate hinweg.
  example: Von Scratch zu Python und Robotik.
- path: Education/Teaching Materials
  purpose: Product-spezifische Lehr- und Lernmaterialien.
  example: Challenge Cards für einen Robotik-Workshop.
- path: Customers and CRM
  purpose: Kanonischer Product-Kontext für Zielgruppen-, Kunden- und CRM-Anforderungen.
  example: Schulen, Eltern und Teilnehmende als unterschiedliche CRM-Kontexte.
- path: Marketing and Communication
  purpose: Product-spezifische Markt-, Brand- und Kommunikationsinhalte.
  example: Monatlicher Lernplan oder Website-Produktbeschreibung.
- path: Finance and Fundraising
  purpose: Product-spezifischer Finanzierungs- und Fundraising-Kontext ohne Belegablage.
  example: Fördermodell eines Bildungsprogramms.
- path: Systems and Integrations
  purpose: Systems, Schnittstellen und Integrationen, die das Product nutzt.
  example: CRM, Minecraft Education und cpKnowledgeSystem.
- path: Archive
  purpose: Nicht mehr aktive, aber aufzubewahrende Product-Inhalte.
  example: Abgelöstes Kurskonzept oder eingestelltes Offering.
documents:
- path: 00 Product Template.md
  purpose: Kanonische Hauptdatei eines langlebigen Products oder Operating Ventures.
  example: JuniorCodingClub als aktives Product mit Zielgruppen, Offerings, Programs, Systems und Development-Kontext.
  frontmatter:
    document_type: entity_document
    entity_id: PRODUCT-TBD
    entity_type: product
    title: Product Name
    status: candidate
    owner: ORG-TBD
    aliases: []
    related_entities: []
    sensitivity: internal
    memory_eligible: true
    agent_access:
    - owner
    - knowledge_architect
    contains_personal_data: false
    retention_class: canonical
    entity_roles:
    - product
    brand_roles: []
    canonical_vault_path: Products/Product Name
    target_groups: []
    operating_organizations: []
    supporting_organizations: []
    service_offerings: []
    programs: []
    related_systems: []
    related_processes: []
    development_context: Development/Product Name
    source_registry: Source Registry Template.md
  sections:
  - heading: Product Overview
    level: 1
    instruction: Kanonische Product-Identität, Rolle und Lifecycle-Status zusammenfassen.
    example: JuniorCodingClub ist ein langlebiges Bildungs-Product und Operating Venture.
    starter: []
  - heading: Purpose
    level: 2
    instruction: Dauerhaften Product-Zweck und Problemraum beschreiben.
    example: Kinder erhalten systematischen Zugang zu Coding, Robotik und digitalem Gestalten.
    starter: []
  - heading: Target Groups
    level: 2
    instruction: Primäre Nutzer, Käufer, Partner und Begünstigte unterscheiden.
    example: Kinder, Eltern, Schulen und Förderpartner.
    starter: []
  - heading: Value Proposition
    level: 2
    instruction: Kernnutzen und Differenzierung prägnant darstellen.
    example: Praxisnahe, altersgerechte Coding-Angebote mit langfristigen Lernpfaden.
    starter: []
  - heading: Product Ownership
    level: 2
    instruction: Product Owner sowie betreibende und unterstützende Organizations benennen.
    example: Educody GmbH betreibt; Digitaltutor e.V. unterstützt Förderprogramme.
    starter: []
  - heading: Service Offerings
    level: 2
    instruction: Wiederkehrende Leistungen über stabile Offering-IDs referenzieren.
    example: Coding Clubs, Holiday Camps und Teacher Training.
    starter: []
  - heading: Programs
    level: 2
    instruction: Längerfristige Product-Programs referenzieren.
    example: Robogirls und Robots for Nature.
    starter: []
  - heading: Operating Model
    level: 2
    instruction: Wie das Product aktuell betrieben und gesteuert wird beschreiben.
    example: Kurse und Clubs werden in Kooperation mit Schulen durchgeführt.
    starter: []
  - heading: Systems and Processes
    level: 2
    instruction: Relevante Systems, Integrationen und kanonische Processes verlinken.
    example: CRM, Minecraft Education, Course Management und Partnership Management.
    starter: []
  - heading: Development
    level: 2
    instruction: Kanonischen Development-Kontext referenzieren, ohne Sollinhalte zu duplizieren.
    example: Development/JuniorCodingClub.
    starter: []
  - heading: Sources and Provenance
    level: 2
    instruction: Source Registry und maßgebliche Evidenz verlinken.
    example: Confluence-Export, Website, MBOX und Vertragsreferenzen.
    starter: []
  - heading: Sensitivity and Access
    level: 2
    instruction: Product-spezifische Schutz- und Retrieval-Regeln dokumentieren.
    example: Teilnehmerrecords sind restricted und memory-ineligible.
    starter: []
- path: Product Management/Product Vision Template.md
  purpose: Kanonische langfristige Product Vision.
  example: JuniorCodingClub macht hochwertige digitale Bildung für Kinder dauerhaft zugänglich.
  frontmatter:
    document_type: run_document
    document_id: PRODUCT-VISION-TBD
    title: Product Vision
    status: draft
    primary_entity: PRODUCT-TBD
    owner: ORG-TBD
    sensitivity: internal
    memory_eligible: true
    agent_access:
    - owner
    - knowledge_architect
    contains_personal_data: false
    retention_class: operational
  sections:
  - heading: Product Vision
    level: 1
    instruction: Langfristigen angestrebten Zustand in einem klaren Zukunftsbild formulieren.
    example: Jedes interessierte Kind kann unabhängig vom Schulstandort Coding und Robotik lernen.
    starter: []
  - heading: Strategic Intent
    level: 2
    instruction: Strategische Stoßrichtung und Prioritäten ableiten.
    example: Skalierbare Partnerangebote und hochwertige Lernpfade.
    starter: []
  - heading: Boundaries
    level: 2
    instruction: Explizit benennen, was nicht Teil der Vision ist.
    example: Keine allgemeine Nachhilfeplattform für sämtliche Schulfächer.
    starter: []
  - heading: Success Indicators
    level: 2
    instruction: Wenige langfristige Erfolgsindikatoren definieren.
    example: Wiederkehrende Partner, Lernfortschritt und tragfähiger Betrieb.
    starter: []
- path: Product Management/Value Proposition Template.md
  purpose: Strukturierte Value Proposition für Zielgruppen und Stakeholder.
  example: Schulen erhalten ein verlässliches Coding-Angebot ohne eigene Speziallehrkräfte aufbauen zu müssen.
  frontmatter:
    document_type: run_document
    document_id: PRODUCT-VALUE-TBD
    title: Value Proposition
    status: draft
    primary_entity: PRODUCT-TBD
    owner: ORG-TBD
    sensitivity: internal
    memory_eligible: true
    agent_access:
    - owner
    - knowledge_architect
    contains_personal_data: false
    retention_class: operational
  sections:
  - heading: Value Proposition
    level: 1
    instruction: Kernnutzen des Products zusammenfassen.
    example: Hochwertige Coding- und Robotics-Angebote für Kinder und Schulen.
    starter: []
  - heading: Target Group Needs
    level: 2
    instruction: Probleme, Bedürfnisse und Jobs-to-be-done je Zielgruppe beschreiben.
    example: Schulen benötigen qualifiziertes Personal und erprobte Curricula.
    starter: []
  - heading: Benefits
    level: 2
    instruction: Funktionale, emotionale und institutionelle Vorteile benennen.
    example: Planungssicherheit, Lernmotivation und sichtbare Projektergebnisse.
    starter: []
  - heading: Differentiation
    level: 2
    instruction: Relevante Abgrenzung zu Alternativen darstellen.
    example: Verbindung aus Pädagogik, Softwareentwicklung und Physical Computing.
    starter: []
  - heading: Evidence
    level: 2
    instruction: Belege, Erfahrungen und Source-Referenzen angeben.
    example: Mehrjährige Schulkooperationen und abgeschlossene Kursreihen.
    starter: []
- path: Product Management/Business Model Template.md
  purpose: Aktuell gültiges Product-Business- und Operating-Model.
