[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-importer"
version = "0.1.0"
description = "Knowledge Import Pipeline for Archibald"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "markdownify",
    "pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["knowledge_importer*"]
namespaces = true

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88