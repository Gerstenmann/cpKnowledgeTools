# Project-scoped Codex bootstrap for cpKnowledgeTools.
# Loaded only when this repository is trusted by Codex.
trust_level = "trusted"
default_permissions = "cpknowledge-dev"

[permissions.cpknowledge-dev]
description = "Local cpKnowledgeTools development with a protected agent-control plane and no default network access."
extends = ":workspace"

[permissions.cpknowledge-dev.filesystem.":workspace_roots"]
"AGENTS.md" = "read"
".codex" = "read"
"**/*.env" = "deny"

[permissions.cpknowledge-dev.network]
enabled = false

[mcp_servers.cp_wiki]
command = "/Users/cp/Developer/cpKnowledgeTools/.venv/bin/cp-wiki-mcp"
args = ["--transport", "stdio"]
cwd = "/Users/cp/Developer/cpKnowledgeTools"
enabled = true
required = true
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "writes"
enabled_tools = [
  "vault_info",
  "resolve_active_artifact",
  "read_active_artifact",
  "resolve_governance_bundle",
  "read_vault_note",
  "search_vault_text",
  "search_vault_frontmatter",
  "resolve_vault_wikilink",
]

[mcp_servers.cp_wiki.env]
CP_WIKI_VAULT_ROOT = "/Users/cp/Documents/cp-wiki"
