[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-knowledge-tools"
version = "0.1.0"
description = "Local Python tooling for the cpKnowledgeSystem and cp-wiki vault"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "markdownify",
    "mcp>=1.28,<2",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
cp-template = "cp_knowledge_tools.template_generator.cli:main"
cp-wiki-mcp = "cp_knowledge_tools.mcp.cp_wiki.server:main"
cp-tools-mcp = "cp_knowledge_tools.mcp.cp_tools.server:main"
cpks = "cp_knowledge_tools.cli.cpks:main"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cp_knowledge_tools*"]
namespaces = true

[tool.setuptools.package-data]
"cp_knowledge_tools.template_generator.resources" = ["contexts/*.yaml"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", "artifacts"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
