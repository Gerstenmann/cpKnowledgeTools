    retention_class: operational
  sections:
  - heading: Business Model
    level: 1
    instruction: Wertschöpfungs- und Betriebslogik zusammenfassen.
    example: Direkte Schulverträge werden mit geförderten Programmen kombiniert.
    starter: []
  - heading: Customer Segments
    level: 2
    instruction: Zahlende Kunden, Nutzer und Begünstigte unterscheiden.
    example: Schulen zahlen; Kinder nutzen; Eltern beeinflussen die Nachfrage.
    starter: []
  - heading: Revenue and Funding
    level: 2
    instruction: Erlös- und Förderlogik ohne Belegdaten beschreiben.
    example: Kursvergütung, Campgebühren und projektbezogene Förderung.
    starter: []
  - heading: Cost Structure
    level: 2
    instruction: Wesentliche Kostenblöcke benennen.
    example: Lehrpersonal, Vorbereitung, Hardware, Software und Administration.
    starter: []
  - heading: Key Resources and Partners
    level: 2
    instruction: Kritische Ressourcen und Partnerschaften aufführen.
    example: Didaktisches Know-how, Lehrkräfte, Schulen und Plattformzugänge.
    starter: []
  - heading: Risks and Assumptions
    level: 2
    instruction: Tragende Annahmen und wesentliche Risiken dokumentieren.
    example: Auslastung, Personalverfügbarkeit und Partnerbindung.
    starter: []
