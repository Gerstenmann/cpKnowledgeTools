[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-knowledge-tools"
version = "0.1.0"
description = "CP Knowledge System and import pipeline for Archibald"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "markdownify",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
cp-template = "cp_knowledge_tools.template_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cp_knowledge_tools*"]
namespaces = true

[tool.setuptools.package-data]
"cp_knowledge_tools.template_generator.resources" = ["contexts/*.yaml"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88